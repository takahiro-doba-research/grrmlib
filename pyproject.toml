[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "grrmlib"
version = "0.2.0"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 別のフォルダに同じ名前のテストファイルを置けるようにする。
# コンテナは root で動くので、ホストで消せない .pytest_cache を作らない
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider"]
